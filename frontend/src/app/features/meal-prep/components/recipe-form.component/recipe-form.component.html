<section class="form-container">
  <h2>Create a New Recipe</h2>

  @if (errorMessage()) {
  <p class="error-banner">{{ errorMessage() }}</p>
  }

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Recipe Name</label>
      <input id="name" type="text" formControlName="name" placeholder="e.g., Pan-Seared Chicken and Rice" />
    </div>

    <p class="form-hint">
      * All ingredients and quantities must be entered for <strong>a single serving</strong>.
    </p>
    <div class="form-group">
      <label for="instructions">Preparation Instructions</label>
      <textarea id="instructions" rows="4" formControlName="instructions" placeholder="Cooking steps..."></textarea>
    </div>

    <fieldset class="ingredients-section">
      <legend>Ingredients</legend>

      <div formArrayName="ingredients">
        @for (control of ingredients.controls; track $index) {
        <div [formGroupName]="$index" class="ingredient-row">
          <select formControlName="foodItemId">
            <option value="" disabled>Select a food item...</option>
            @for (food of availableFoods(); track food.id) {
            <option [value]="food.id">{{ food.name }} ({{ food.calories }} kcal/100g)</option>
            }
          </select>

          <input type="number" formControlName="quantityGrams" placeholder="Grams" min="1" />

          <button type="button" class="btn-remove" (click)="removeIngredient($index)"
            [disabled]="ingredients.length === 1">
            Remove
          </button>
        </div>
        }
      </div>

      <button type="button" class="btn-add" (click)="addIngredient()">+ Add Ingredient</button>
    </fieldset>

    <div class="form-actions">
      <a routerLink="/recipes" class="btn-cancel">Cancel</a>
      <button type="submit" [disabled]="recipeForm.invalid || isSubmitting()" class="btn-submit">
        {{ isSubmitting() ? 'Calculating and saving...' : 'Save Recipe' }}
      </button>
    </div>
  </form>
</section>

<section class="recipes-container">
    <div class="page-header">
        <div>
            <h2>Meal Prep Recipes</h2>
            <p>Saved recipes with automatically calculated macronutrients</p>
        </div>
        <a routerLink="/recipes/new" class="btn-primary">
            + New Recipe
        </a>
    </div>

    @if (isLoading()) {
    <p class="status-msg">Loading recipes...</p>
    } @else if (errorMessage()) {
    <p class="status-msg error">{{ errorMessage() }}</p>
    } @else {
    <div class="recipes-grid">
        @for (recipe of recipes(); track recipe.id) {
        <app-recipe-card [recipe]="recipe"></app-recipe-card>
        } @empty {
        <div class="empty-state">
            <p>No saved recipes yet.</p>
        </div>
        }
    </div>
    }
</section>

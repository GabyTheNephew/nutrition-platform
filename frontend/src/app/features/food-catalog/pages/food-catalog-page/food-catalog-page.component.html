<section class="catalog-container">
  <header class="catalog-header">
    <div>
      <h2>Food Catalog</h2>
      <p>Nutritional values expressed per 100g of product</p>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <input #searchInput type="text" placeholder="Search food (e.g., chicken, oats)..." (input)="onSearchInput($event)" />
      @if (searchQuery()) {
      <button type="button" class="btn-clear" (click)="clearSearch(searchInput)">✕</button>
      }
    </div>
  </header>

  <!-- Dominant Macronutrient Filter Buttons -->
  <nav class="filters-bar">
    <button type="button" class="filter-pill" [class.active]="activeFilter() === 'ALL'" (click)="onFilterChange('ALL')">
      All
    </button>
    <button type="button" class="filter-pill protein" [class.active]="activeFilter() === 'PROTEIN'"
      (click)="onFilterChange('PROTEIN')">
      Protein
    </button>
    <button type="button" class="filter-pill carbohydrate" [class.active]="activeFilter() === 'CARBOHYDRATE'"
      (click)="onFilterChange('CARBOHYDRATE')">
      Carbs
    </button>
    <button type="button" class="filter-pill fat" [class.active]="activeFilter() === 'FAT'"
      (click)="onFilterChange('FAT')">
      Fat
    </button>
  </nav>

  @if (isLoading()) {
  <p class="status-msg">Loading food items...</p>
  } @else if (errorMessage()) {
  <p class="status-msg error">{{ errorMessage() }}</p>
  } @else {
  <div class="food-grid">
    @for (food of foods(); track food.id) {
    <app-food-card [food]="food"></app-food-card>
    } @empty {
    <div class="empty-state">
      <p>No food items found matching your criteria.</p>
    </div>
    }
  </div>
  }
</section>

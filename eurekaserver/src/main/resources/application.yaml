server:
  port: 8761

spring:
  application:
    name: eurekaserver

eureka:
  instance:
    hostname: localhost
  client:
    # Serverul Eureka nu trebuie sa se inregistreze pe el insusi ca si client
    register-with-eureka: false
    # Nu trebuie sa descarce registrul de la el insusi
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/